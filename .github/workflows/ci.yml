name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Import the stateless core
        run: python -c "from app.core.engine import generate_report; print('core import ok')"

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      # Guards the public-release boundary: no business data may enter the repo.
      - name: Public release scan
        run: python tools/public_release_check.py

      - name: Repository must stay free of business artefacts
        run: |
          python - <<'PY'
          import pathlib, sys, unicodedata

          def norm(value):
              return unicodedata.normalize("NFC", str(value))

          ALLOWED = {norm("input/简称.xlsx")}
          BAD_SUFFIX = {".xls", ".xlsx", ".xlsm", ".db", ".sqlite", ".sqlite3", ".log", ".zip"}

          hits = []
          for p in pathlib.Path(".").rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              if p.suffix.lower() in BAD_SUFFIX and norm(p) not in ALLOWED:
                  hits.append(str(p))
          if hits:
              print("\n".join(sorted(hits)))
              sys.exit("unexpected data artefact in the repository")
          print("ok: no data artefacts beyond the synthetic example map")
          PY
